# Publishes a GitHub Release's zip to Thunderstore.
#
# The package is built locally by ./package.sh and attached to the Release -- this workflow
# only forwards that exact artifact, so nothing here breaks when Valheim updates and what
# ships is what was playtested.
#
# Requires a repository secret TCLI_AUTH_TOKEN: a Thunderstore service account token from
# your team's settings.
name: Publish to Thunderstore

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  thunderstore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Thunderstore CLI
        run: |
          dotnet tool install -g tcli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Download the release package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir dist
          ls -la dist

      - name: Publish
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          if [ -z "$TCLI_AUTH_TOKEN" ]; then
            echo "::error::TCLI_AUTH_TOKEN secret is not set; nothing was published."
            exit 1
          fi
          zip=$(find dist -maxdepth 1 -name '*.zip' | head -n1)
          if [ -z "$zip" ]; then
            echo "::error::No .zip asset attached to this release."
            exit 1
          fi
          echo "Publishing $zip"
          tcli publish --file "$zip"
