[config]
schemaVersion = "0.0.1"

[package]
namespace = "wheezl"
name = "QuantumObliterator"
versionNumber = "0.3.0"
description = "Two Obliterators whose nearby signs read the same thing become a linked pair - pull the lever on one and its contents are shipped to the other, anywhere in the world, for one fuel item. An Obliterator with no sign behaves exactly like vanilla."
websiteUrl = "https://github.com/wheezl1/QuantumObliterator"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2350"
"ValheimModding-Jotunn" = "2.30.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./dist"

# Flat layout: a target ending in "/" drops the file in that directory under its own name, so
# "/" puts the DLL at the package root next to manifest.json / icon.png / README.md -- what
# every Valheim package installs as under Gale and r2modman.
[[build.copy]]
source = "./bin/Release/QuantumObliterator.dll"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]
